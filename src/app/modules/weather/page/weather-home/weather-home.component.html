<div class="search">
  <form #form="ngForm" (submit)="onSubmit()">
    <input
      type="text"
      placeholder="Search location"
      name="city"
      [(ngModel)]="initialCityName"
      aria-label="Enter city name"
    />

    <button type="submit" class="search-button" aria-label="Search weather">
      <fa-icon
        size="lg"
        class="search-icon"
        [icon]="searchIcon"
      ></fa-icon>
    </button>
  </form>
</div>

<div class="card-container" *ngIf="weatherData">
  <app-weather-card
    [weatherData]="weatherData"
    class="weather-card"
  ></app-weather-card>
  <app-city-info-card [weatherData]="weatherData"></app-city-info-card>
</div>
