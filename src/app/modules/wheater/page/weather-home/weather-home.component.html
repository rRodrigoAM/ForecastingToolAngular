<div class="search">
  <form #form="ngForm" (submit)="onSubmit()">
    <input
      type="text"
      placeholder="Buscar localização"
      name="city"
      [(ngModel)]="initialCityName"
      aria-label="Digite o nome da cidade"
    />

    <button type="submit" class="search-button" aria-label="Buscar clima">
      <fa-icon
        size="lg"
        class="search-icon"
        [icon]="searchIcon"
      ></fa-icon>
    </button>
  </form>
</div>

<div class="card-container">
  <app-weather-card 
    *ngIf="weatherDatas" 
    [weatherDatasInput]="weatherDatas"
    class="weather-card"
  ></app-weather-card>
</div>
